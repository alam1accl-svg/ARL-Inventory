<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARL Control Tower - Akij Resource Limited</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#060b14;--card:#0d1525;--card2:#131d33;--t1:#e2e8f0;--t2:#94a3b8;--t3:#4b5563;--teal:#0EA5A4;--gold:#FBBF24;--blue:#57C3FF;--purple:#9A91FB;--red:#EF4444;--green:#10B981;--orange:#FDB52A;--border:#1a2744}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;overflow-x:hidden}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.topbar{background:linear-gradient(180deg,#0d1525,#060b14);border-bottom:2px solid var(--teal);padding:10px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
.topbar h1{font-size:20px;font-weight:900;background:linear-gradient(135deg,var(--teal),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar .sub{font-size:10px;color:var(--t3)}
.live-dot{width:10px;height:10px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite;display:inline-block}
.live-text{font-size:10px;color:var(--green);font-weight:700}
.btn{background:var(--card2);border:1px solid var(--border);color:var(--t2);padding:6px 12px;border-radius:5px;font-size:10px;cursor:pointer;transition:all 0.2s;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--teal);color:var(--teal)}
.btn.on{background:rgba(14,165,164,0.15);border-color:var(--teal);color:var(--teal);font-weight:700}
.tabs{display:flex;gap:4px;padding:8px 24px 0;background:var(--bg);flex-wrap:wrap}
.tab{padding:8px 16px;border:1px solid var(--border);border-bottom:none;border-radius:6px 6px 0 0;font-size:11px;color:var(--t2);cursor:pointer;background:var(--card);transition:all .15s}
.tab:hover{color:var(--teal)}
.tab.on{background:var(--card2);color:var(--teal);font-weight:700;border-color:var(--teal)}
.kpi-strip{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;padding:10px 24px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;text-align:center;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.kpi.g::before{background:var(--green)} .kpi.r::before{background:var(--red)} .kpi.o::before{background:var(--orange)} .kpi.t::before{background:var(--teal)} .kpi.p::before{background:var(--purple)} .kpi.b::before{background:var(--blue)}
.kpi .lbl{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.kpi .val{font-size:18px;font-weight:800;line-height:1}
.kpi .sub{font-size:8px;color:var(--t3);margin-top:3px}
.main{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:0 24px 16px;max-width:1920px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--card2)}
.card-h h3{font-size:11px;font-weight:600;color:var(--t2)}
.card-b{padding:8px 14px}
.ft{grid-column:1/-1}
.v2{grid-column:span 2}
table{width:100%;border-collapse:collapse;font-size:10px}
th{text-align:left;padding:5px 7px;color:var(--t3);font-size:8px;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border)}
td{padding:4px 7px;border-bottom:1px solid rgba(26,39,68,0.5);color:var(--t2)}
tr:hover td{background:rgba(14,165,164,0.04)}
.bg{padding:1px 6px;border-radius:3px;font-size:7px;font-weight:700;white-space:nowrap}
.br{background:rgba(239,68,68,0.15);color:var(--red)}
.bo{background:rgba(253,181,42,0.15);color:var(--orange)}
.bt{background:rgba(14,165,164,0.15);color:var(--teal)}
.bb{background:rgba(87,195,255,0.15);color:var(--blue)}
.alert{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;border-radius:5px;font-size:9px;margin-bottom:5px;line-height:1.4}
.ar{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);color:#fca5a5}
.ao{background:rgba(253,181,42,0.08);border:1px solid rgba(253,181,42,0.25);color:#fcd34d}
.ag{background:rgba(16,185,129,0.06);border:1px solid rgba(16,185,129,0.2);color:#6ee7b7}
.chart-wrap{height:220px;position:relative}
.scroll{max-height:340px;overflow-y:auto}
.footer{text-align:center;padding:8px;font-size:9px;color:var(--t3);border-top:1px solid var(--border)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
@media(max-width:1400px){.main{grid-template-columns:1fr 1fr}.kpi-strip{grid-template-columns:repeat(4,1fr)}}
@media(max-width:900px){.main{grid-template-columns:1fr}.kpi-strip{grid-template-columns:repeat(2,1fr)}}
.panel{display:none}
.panel.on{display:block}
</style>
</head>

var CUR="overview";
function setTab(t){CUR=t;document.querySelectorAll(".tab").forEach(function(x){x.classList.toggle("on",x.dataset.t===t)});render()}

function tabsBar(){
var ts=[["overview","Overview"],["stock","Closing Stock"],["pr","PR Pending"],["aging","Inventory Aging"],["dio","DIO & Turnover"],["clearance","Clearance Pending"],["alerts","Alerts"]];

function kpis(){
var tPos=D.filter(function(x){return x.v>0}).reduce(function(s,x){return s+x.v},0);
var tNeg=Math.abs(D.filter(function(x){return x.v<0}).reduce(function(s,x){return s+x.v},0));

}

function panelDIO(){
var rows=TO.map(function(x){return {s:x.s,inv:x.inv,cogs:x.cogs,turn:x.cogs/Math.max(x.inv,1),dio:(x.inv/Math.max(x.cogs,1))*365}}).sort(function(a,b){return b.dio-a.dio});
var h='<div class="card ft"><div class="card-h"><h3>&#x1F4C8; Inventory DIO &amp; Turnover Ratio</h3><span style="font-size:9px;color:var(--t3)">DIO = (Avg Inv / COGS) x 365 | Turnover = COGS / Avg Inv | YTD 2026</span></div><div class="card-b"><div class="scroll"><table><thead><tr><th>SBU</th><th>Inventory (BDT)</th><th>COGS YTD (BDT)</th><th>Turnover (x)</th><th>DIO (days)</th><th>Health</th></tr></thead><tbody>';
rows.forEach(function(x){
var health=x.dio>365?"br":x.dio>120?"bo":"bt";
var ht=x.dio>365?"High Risk":x.dio>120?"Watch":"Healthy";
h+='<tr><td style="font-weight:500;color:var(--t1)">'+x.s+'</td><td style="font-weight:600;color:var(--t2)">'+x.inv.toLocaleString()+'</td><td style="color:var(--t3)">'+x.cogs.toLocaleString()+'</td><td style="font-weight:600;color:var(--teal)">'+x.turn.toFixed(2)+'x</td><td style="font-weight:700;color:'+(x.dio>365?"var(--red)":x.dio>120?"var(--orange)":"var(--green)")+'">'+x.dio.toFixed(0)+'d</td><td><span class="bg '+health+'">'+ht+'</span></td></tr>';

function panelAlerts(){
