<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>ARL Inventory Control Tower - Akij Resource Limited</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#060b14;--card:#0d1525;--card2:#131d33;--t1:#e2e8f0;--t2:#94a3b8;--t3:#4b5563;--teal:#0EA5A4;--gold:#FBBF24;--blue:#57C3FF;--purple:#9A91FB;--red:#EF4444;--green:#10B981;--orange:#FDB52A;--border:#1a2744}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;overflow-x:hidden}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.topbar{background:linear-gradient(180deg,#0d1525,#060b14);border-bottom:2px solid var(--teal);padding:10px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
.topbar h1{font-size:20px;font-weight:900;background:linear-gradient(135deg,var(--teal),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar .sub{font-size:10px;color:var(--blue);font-weight:700;letter-spacing:0.5px}
.live-dot{width:10px;height:10px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite;display:inline-block}
.live-text{font-size:10px;color:var(--green);font-weight:700}
.btn{background:var(--card2);border:1px solid var(--border);color:var(--t2);padding:6px 12px;border-radius:5px;font-size:10px;cursor:pointer;transition:all 0.2s;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--teal);color:var(--teal)}
.btn.on{background:rgba(14,165,164,0.15);border-color:var(--teal);color:var(--teal);font-weight:700}
.tabs{display:flex;gap:4px;padding:8px 24px 0;background:var(--bg);flex-wrap:wrap}
.tab{padding:8px 16px;border:1px solid var(--border);border-bottom:none;border-radius:6px 6px 0 0;font-size:11px;color:var(--t2);cursor:pointer;background:var(--card);transition:all .15s}
.tab:hover{color:var(--teal)}
.tab.on{background:var(--card2);color:var(--teal);font-weight:700;border-color:var(--teal)}
.kpi-strip{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;padding:10px 24px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;text-align:center;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.kpi.g::before{background:var(--green)} .kpi.r::before{background:var(--red)} .kpi.o::before{background:var(--orange)} .kpi.t::before{background:var(--teal)} .kpi.p::before{background:var(--purple)} .kpi.b::before{background:var(--blue)}
.kpi .lbl{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.kpi .val{font-size:18px;font-weight:800;line-height:1}
.kpi .sub{font-size:8px;color:var(--t3);margin-top:3px}
.main{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:0 24px 16px;max-width:1920px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--card2)}
.card-h h3{font-size:11px;font-weight:600;color:var(--t2)}
.card-b{padding:8px 14px}
.ft{grid-column:1/-1}
.v2{grid-column:span 2}
table{width:100%;border-collapse:collapse;font-size:10px}
th{text-align:left;padding:5px 7px;color:var(--t3);font-size:8px;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border)}
td{padding:4px 7px;border-bottom:1px solid rgba(26,39,68,0.5);color:var(--t2)}
tr:hover td{background:rgba(14,165,164,0.04)}
.bg{padding:1px 6px;border-radius:3px;font-size:7px;font-weight:700;white-space:nowrap}
.br{background:rgba(239,68,68,0.15);color:var(--red)}
.bo{background:rgba(253,181,42,0.15);color:var(--orange)}
.bt{background:rgba(14,165,164,0.15);color:var(--teal)}
.bb{background:rgba(87,195,255,0.15);color:var(--blue)}
.alert{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;border-radius:5px;font-size:9px;margin-bottom:5px;line-height:1.4}
.ar{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);color:#fca5a5}
.ao{background:rgba(253,181,42,0.08);border:1px solid rgba(253,181,42,0.25);color:#fcd34d}
.ag{background:rgba(16,185,129,0.06);border:1px solid rgba(16,185,129,0.2);color:#6ee7b7}
.chart-wrap{height:220px;position:relative}
.scroll{max-height:340px;overflow-y:auto}
.footer{text-align:center;padding:8px;font-size:9px;color:var(--t3);border-top:1px solid var(--border)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
@media(max-width:1400px){.main{grid-template-columns:1fr 1fr}.kpi-strip{grid-template-columns:repeat(4,1fr)}}
@media(max-width:900px){.main{grid-template-columns:1fr}.kpi-strip{grid-template-columns:repeat(2,1fr)}}
.panel{display:none}
.panel.on{display:block}
.chat-box{max-height:440px;min-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px}
.msg{max-width:88%;padding:8px 12px;border-radius:8px;font-size:11px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:rgba(87,195,255,0.12);border:1px solid rgba(87,195,255,0.35);color:#bfe3ff}
.msg.agent{align-self:flex-start;background:var(--card2);border:1px solid var(--border);color:var(--t1)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{background:rgba(14,165,164,0.1);border:1px solid var(--teal);color:var(--teal);font-size:9px;font-weight:600;padding:4px 10px;border-radius:12px;cursor:pointer;white-space:nowrap}
.chip:hover{background:rgba(14,165,164,0.25)}
.agent-input{display:flex;gap:8px;margin-top:8px}
.agent-input input{flex:1;background:var(--card2);border:1px solid var(--border);color:var(--t1);padding:8px 12px;border-radius:5px;font-size:11px;outline:none;font-family:inherit}
.agent-input input:focus{border-color:var(--teal)}
</style>
</head>

function loadData(d){
if(d.stock&&d.stock.length){D=d.stock.map(function(x){return{s:x.s,v:x.v,c:"SBU"}})}
if(d.pr&&d.pr.length){P=d.pr}
if(d.aging&&d.aging.length){A=d.aging.map(function(x){return{s:x.s,i:"Inventory",v:x.v,d:x.d,c:x.c}})}
if(d.dio&&d.dio.length){TO=d.dio.map(function(x){return{s:x.s,inv:x.inv,cogs:x.cogs}})}
if(d.clearance&&d.clearance.length){CL=d.clearance}
}

function useFallback(){
D=FALLBACK.stock;P=FALLBACK.pr;A=FALLBACK.aging;TO=FALLBACK.dio;CL=FALLBACK.clearance;
}

function f(v){if(Math.abs(v)>=10000000)return(v/10000000).toFixed(2)+" Cr";if(Math.abs(v)>=100000)return(v/100000).toFixed(2)+" Lac";return Math.round(v).toLocaleString()}

var CUR="overview";
function setTab(t){CUR=t;document.querySelectorAll(".tab").forEach(function(x){x.classList.toggle("on",x.dataset.t===t)});render()}

function tabsBar(){
var ts=[["overview","Overview"],["stock","Closing Stock"],["pr","PR Pending"],["aging","Inventory Aging"],["dio","DIO & Turnover"],["clearance","Clearance Pending"],["alerts","Alerts"],["strategy","Strategy"],["agent","AI Agent"]];
document.getElementById("tabs").innerHTML=ts.map(function(x){return '<div class="tab'+(x[0]===CUR?" on":"")+'" data-t="'+x[0]+'" onclick="setTab(\x60'+x[0]+'\x60)">'+x[1]+'</div>'}).join("");
}

function kpis(){
var tPos=D.filter(function(x){return x.v>0}).reduce(function(s,x){return s+x.v},0);
var tNeg=Math.abs(D.filter(function(x){return x.v<0}).reduce(function(s,x){return s+x.v},0));
var tP=P.reduce(function(s,x){return s+x.q},0);
var tPR=P.reduce(function(s,x){return s+x.n},0);
var tCL=CL.reduce(function(s,x){return s+x.c},0);
var dio=TO.map(function(x){return {s:x.s,d:(x.inv/Math.max(x.cogs,1))*365}}).filter(function(x){return x.d>0&&x.d<2000}).sort(function(a,b){return b.d-a.d});
var tDio=dio.length?dio.reduce(function(s,x){return s+x.d},0)/dio.length:0;

'<div class="kpi o"><div class="lbl">PR Pending Qty</div><div class="val" style="color:var(--orange)">'+f(tP)+'</div><div class="sub">'+tPR.toLocaleString()+' PRs</div></div>'+
'<div class="kpi t"><div class="lbl">Avg DIO</div><div class="val" style="color:var(--teal)">'+tDio.toFixed(0)+'d</div><div class="sub">'+dio.length+' SBUs</div></div>'+
'<div class="kpi p"><div class="lbl">Clearance Pending</div><div class="val" style="color:var(--purple)">'+tCL.toLocaleString()+'</div><div class="sub">PeopleDesk</div></div>'+
'<div class="kpi r"><div class="lbl">Aging At-Risk</div><div class="val" style="color:var(--red)">'+f(A.filter(function(x){return x.v>0}).reduce(function(s,x){return s+x.v},0))+'</div><div class="sub">'+A.length+' items</div></div>'+
'<div class="kpi o"><div class="lbl">Obsolete</div><div class="val" style="color:var(--orange)">'+A.filter(function(x){return x.c==="Obsolete"}).length+'</div><div class="sub">>365 days</div></div>'+
'<div class="kpi b"><div class="lbl">Active SBUs</div><div class="val" style="color:var(--blue)">'+D.length+'</div><div class="sub">DWH Database</div></div>';
}

function render(){

if(CUR==="overview"||CUR==="alerts"){

function panelStock(){
var h='<div class="card ft"><div class="card-h"><h3>&#x1F4B0; Closing Stock - All Business Concerns</h3><span style="font-size:9px;color:var(--t3)">Source: GL Journal | '+new Date().toLocaleString()+'</span></div><div class="card-b"><div class="scroll"><table><thead><tr><th>#</th><th>SBU</th><th>Sector</th><th>Net Value (BDT)</th><th>Status</th></tr></thead><tbody>';
D.slice().sort(function(a,b){return Math.abs(b.v)-Math.abs(a.v)}).forEach(function(x,i){

return h;
}

function panelAging(){

h+='</tbody></table></div></div></div>';
return h;
}

function panelDIO(){

function panelAgent(){
var h='<div class="card ft"><div class="card-h"><h3>&#x1F916; ARL Inventory AI Agent</h3><span style="font-size:9px;color:var(--t3)">Natural language over DWH data | /api/agent | MCP: askInventoryAgent</span></div><div class="card-b">';

function agentRender(busy){
var el=document.getElementById("chatBox");if(!el)return;
var h=AGENT_MSGS.map(function(m){return '<div class="msg '+m.r+'">'+String(m.t).replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</div>'}).join("");
if(busy)h+='<div class="msg agent"><span class="live-dot" style="width:6px;height:6px;margin-right:6px"></span>Analyzing control tower data...</div>';
el.innerHTML=h;
el.scrollTop=el.scrollHeight;
}

function agentAsk(preset){
var inp=document.getElementById("agentQ");
var q=preset||(inp?inp.value.trim():"");
if(!q)return;
if(inp)inp.value="";
AGENT_MSGS.push({r:"user",t:q});
agentRender(true);
fetch("/api/agent?q="+encodeURIComponent(q)).then(function(r){return r.json()}).then(function(a){
var t=a.answer||a.error||"(no answer)";
if(a.source)t+="\n\n\u2014 data: "+a.source+" @ "+new Date(a.generatedAt||Date.now()).toLocaleString();
AGENT_MSGS.push({r:"agent",t:t});
agentRender();
}).catch(function(){AGENT_MSGS.push({r:"agent",t:"Agent API unreachable \u2014 check /api/agent."});agentRender();});
}

function agentReport(){
AGENT_MSGS.push({r:"user",t:"Show me the full analysis report"});
agentRender(true);
fetch("/api/agent").then(function(r){return r.json()}).then(function(a){
AGENT_MSGS.push({r:"agent",t:a.reportText||JSON.stringify(a.report||a).substring(0,3000)});
agentRender();
}).catch(function(){AGENT_MSGS.push({r:"agent",t:"Agent API unreachable."});agentRender();});
}

function after(){
if(CUR==="overview"||CUR==="dio"){
var rows=TO.map(function(x){return {s:x.s,d:(x.inv/Math.max(x.cogs,1))*365}}).filter(function(x){return x.d>0&&x.d<2000}).sort(function(a,b){return b.d-a.d}).slice(0,12);
var el=document.getElementById("chDio");
if(el){
new Chart(el,{type:"bar",data:{labels:rows.map(function(x){return x.s}),datasets:[{data:rows.map(function(x){return x.d}),backgroundColor:"#0EA5A499",borderColor:"#0EA5A4",borderWidth:1,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:"y",plugins:{legend:{display:false}},scales:{x:{grid:{color:"rgba(26,39,68,0.5)"},ticks:{color:"#94a3b8",font:{size:9},callback:function(v){return v+"d"}}},y:{grid:{display:false},ticks:{color:"#94a3b8",font:{size:9}}}}}});
}
}
}

function setSource(mode,ts){
document.getElementById("lastUpdate").textContent=ts||new Date().toLocaleString();
var dot=document.querySelector(".live-dot"),txt=document.querySelector(".live-text");
if(mode==="live"){dot.style.background="var(--green)";txt.textContent="LIVE";txt.style.color="var(--green)";}
else{dot.style.background="var(--orange)";txt.textContent="SNAPSHOT";txt.style.color="var(--orange)";}
}

function init(){
fetch("/api/data",{cache:"no-store"}).then(function(r){
if(!r.ok)throw new Error("HTTP "+r.status);
return r.json();
}).then(function(d){
loadData(d);
setSource("live",new Date(d.generatedAt).toLocaleString());
render();
}).catch(function(e){
useFallback();
setSource("snapshot",null);
render();
});
}
init();
</script>
