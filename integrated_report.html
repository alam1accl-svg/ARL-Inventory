<style>
:root{--bg:#0F172A;--card:#1d243c;--card2:#2a314e;--t1:#E2E8F0;--t2:#898da5;--t3:#5a5f7a;--teal:#0EA5A4;--gold:#FBBF24;--blue:#57C3FF;--purple:#9A91FB;--red:#EF4444;--green:#10B981;--orange:#FDB52A;--border:#343B4F}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.topbar h1{font-size:18px;color:var(--teal)}
.topbar span{font-size:12px;color:var(--t3)}
.main{padding:24px 32px;max-width:1600px;margin:0 auto}
.section-title{font-size:16px;font-weight:700;color:var(--t1);margin:28px 0 16px;padding-bottom:8px;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:10px}
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 20px}
.kpi .lbl{font-size:11px;color:var(--t3);margin-bottom:6px}
.kpi .val{font-size:24px;font-weight:700}
.kpi .sub{font-size:10px;color:var(--t3);margin-top:4px}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 22px}
.chart-box h3{font-size:13px;color:var(--t2);margin-bottom:12px}
.chart-inner{height:300px;position:relative}
.tbl-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 22px;margin-bottom:24px}
.tbl-box h3{font-size:13px;color:var(--t2);margin-bottom:12px}
.tbl-scroll{max-height:500px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;padding:8px 10px;color:var(--t3);font-size:10px;text-transform:uppercase;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card)}
td{padding:8px 10px;border-bottom:1px solid rgba(52,59,79,0.4);color:var(--t2)}
tr:hover td{background:rgba(14,165,164,0.04)}
.badge{padding:2px 8px;border-radius:3px;font-size:9px;font-weight:600}
.badge-red{background:rgba(239,68,68,0.15);color:var(--red)}
.badge-green{background:rgba(16,185,129,0.15);color:var(--green)}
.badge-orange{background:rgba(253,181,42,0.15);color:var(--orange)}
.badge-teal{background:rgba(14,165,164,0.15);color:var(--teal)}
.neg{color:var(--red);font-weight:600}
.pos{color:var(--green);font-weight:600}
.tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--t3);font-size:11px;cursor:pointer;transition:all 0.2s}
.tab:hover,.tab.active{background:rgba(14,165,164,0.15);border-color:var(--teal);color:var(--teal)}
.search{background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;color:var(--t1);font-size:12px;width:280px}
.search:focus{outline:none;border-color:var(--teal)}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@media(max-width:1200px){.kpi-row{grid-template-columns:repeat(3,1fr)}.chart-row{grid-template-columns:1fr}}
@media(max-width:768px){.main{padding:12px}.kpi-row{grid-template-columns:repeat(2,1fr)}}
@media print{.topbar{position:static}body{background:#fff;color:#000}.kpi,.chart-box,.tbl-box{background:#fff;border:1px solid #ccc}}
</style>
</head>

function renderAll() {
  var tNet=STOCK.reduce(function(s,x){return s+x.net;},0);

      charts.c2=new Chart(document.getElementById('c2'),{type:'bar',data:{labels:top2.map(function(x){return x.sbu.substring(0,20);}),datasets:[{label:'Receipts',data:top2.map(function(x){return x.receipts/10000000;}),backgroundColor:'rgba(16,185,129,0.7)',borderColor:'#10B981',borderWidth:1},{label:'Issues',data:top2.map(function(x){return Math.abs(x.issues)/10000000;}),backgroundColor:'rgba(239,68,68,0.7)',borderColor:'#EF4444',borderWidth:1}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{color:'#898da5',font:{size:10}}}},scales:{x:{grid:{color:'rgba(52,59,79,0.3)'},ticks:{color:'#898da5',font:{size:7},maxRotation:45}},y:{grid:{color:'rgba(52,59,79,0.3)'},ticks:{color:'#898da5',font:{size:10},callback:function(v){return v+' Cr'}}}}}});
    }
    if(document.getElementById('c3')){
      var pTotal=STOCK.reduce(function(s,x){return s+(x.net>0?x.net:0);},0);
      var nTotal=Math.abs(STOCK.reduce(function(s,x){return s+(x.net<0?x.net:0);},0));
      charts.c3=new Chart(document.getElementById('c3'),{type:'doughnut',data:{labels:['Positive Stock','Negative Stock'],datasets:[{data:[pTotal,nTotal],backgroundColor:['rgba(16,185,129,0.7)','rgba(239,68,68,0.7)'],borderColor:['#10B981','#EF4444'],borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#898da5',font:{size:10}}},tooltip:{callbacks:{label:function(c){return 'BDT '+c.raw.toLocaleString()}}}}}});
    }
    if(document.getElementById('c4')){
      charts.c4=new Chart(document.getElementById('c4'),{type:'bar',indexAxis:'y',data:{labels:TOP_ITEMS.map(function(x){return x.item.substring(0,30);}),datasets:[{label:'Value (Cr)',data:TOP_ITEMS.map(function(x){return x.value/10000000;}),backgroundColor:C.slice(0,10).map(function(c){return c+'99'}),borderColor:C.slice(0,10),borderWidth:1,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(52,59,79,0.3)'},ticks:{color:'#898da5',font:{size:10},callback:function(v){return v+' Cr'}}},y:{grid:{display:false},ticks:{color:'#898da5',font:{size:9}}}}}});
    }
  },100);
}

function kpi(c,v,l,s){return '<div class="kpi"><div class="lbl">'+l+'</div><div class="val" style="color:'+c+'">'+v+'</div><div class="sub">'+s+'</div></div>';}

function filterTab(t,el){activeTab=t;document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});if(el)el.classList.add('active');var rows=document.querySelectorAll('#tb1 tr');rows.forEach(function(r){if(t==='all')r.style.display='';else r.style.display=r.getAttribute('data-cat')===t?'':'none';});filterAll();}

function filterAll(){var q=(document.getElementById('globalSearch')||{}).value||'';q=q.toLowerCase();var rows=document.querySelectorAll('#tb1 tr');rows.forEach(function(r){var d=r.getAttribute('data-search');var show=(!q||(d&&d.indexOf(q)>=0));if(activeTab!=='all')show=show&&r.getAttribute('data-cat')===activeTab;r.style.display=show?'':'none';});}


function showNegativeStock() {
  var tNeg=NEG_STOCK.reduce(function(s,x){return s+(x.value<0?x.value:0);},0);
  var h='';
  h+='<div class="kpi-row">';
  h+=kpi('#EF4444',NEG_STOCK.length,'Negative GL Items','Unique positions');
  h+=kpi('#FDB52A',fmt(Math.abs(tNeg)),'Total Negative Value','GL Stock < 0');
  h+=kpi('#57C3FF',(new Set(NEG_STOCK.map(function(x){return x.sbu;}))).size,'Affected SBUs','With negative stock');
  h+=kpi('#9A91FB',NEG_STOCK.filter(function(x){return x.value<0;}).length,'Active Negative','Value < 0');
  h+='</div>';
  h+='<div class="tbl-box"><h3>Negative Stock Items - All Business Concerns</h3><div class="tbl-scroll"><table><thead><tr><th>#</th><th>SBU</th><th>Item / GL Category</th><th>Value (BDT)</th><th>Impact</th></tr></thead><tbody>';
  NEG_STOCK.sort(function(a,b){return a.value-b.value;}).forEach(function(x,i){
    h+='<tr>';
    h+='<td style="color:var(--t3)">'+(i+1)+'</td>';
    h+='<td style="font-weight:500;color:var(--t1)">'+x.sbu+'</td>';
    h+='<td>'+x.item+'</td>';
    h+='<td class="neg">'+x.value.toLocaleString()+'</td>';
    h+='<td><span class="badge '+(Math.abs(x.value)>100000000?'badge-red':'badge-orange')+'">'+(Math.abs(x.value)>100000000?'High Impact':'Low Impact')+'</span></td>';
    h+='</tr>';
  });
  h+='<tr style="font-weight:700;background:rgba(239,68,68,0.05)"><td colspan="3" style="text-align:right;padding:10px">TOTAL NEGATIVE</td><td class="neg">'+tNeg.toLocaleString()+'</td><td></td></tr>';
  h+='</tbody></table></div></div>';
  document.getElementById('content').innerHTML=h;
}

function showReceiptsIssues() {
  var tRec=RECEIPTS_ISSUES.reduce(function(s,x){return s+x.receipts;},0);
  var tIss=RECEIPTS_ISSUES.reduce(function(s,x){return s+x.issues;},0);
  var h='';
  h+='<div class="kpi-row">';
  h+=kpi('#10B981',fmtCr(tRec),'Total Receipts','Inbound value');
  h+=kpi('#EF4444',fmtCr(Math.abs(tIss)),'Total Issues','Outbound value');
  h+=kpi('#57C3FF',RECEIPTS_ISSUES.reduce(function(s,x){return s+x.rTx;},0),'Receipt Txns','WMS transactions');
  h+=kpi('#FDB52A',RECEIPTS_ISSUES.reduce(function(s,x){return s+x.iTx;},0),'Issue Txns','WMS transactions');
  h+='</div>';
  h+='<div class="chart-row">';
  h+='<div class="chart-box"><h3>Receipts vs Issues by SBU</h3><div class="chart-inner"><canvas id="c5"></canvas></div></div>';
  h+='<div class="chart-box"><h3>Transaction Count by SBU</h3><div class="chart-inner"><canvas id="c6"></canvas></div></div>';
  h+='</div>';
  h+='<div class="tbl-box"><h3>Item-wise Total Receipts & Issues - All SBUs (Source: WMS)</h3><div class="tbl-scroll"><table><thead><tr><th>#</th><th>SBU</th><th>Total Receipts (BDT)</th><th>Total Issues (BDT)</th><th>Net (Rec - Iss)</th><th>Receipt Txns</th><th>Issue Txns</th></tr></thead><tbody>';
  RECEIPTS_ISSUES.sort(function(a,b){return (b.receipts+Math.abs(b.issues))-(a.receipts+Math.abs(a.issues));}).forEach(function(x,i){
    var net=x.receipts-Math.abs(x.issues);
    h+='<tr>';
    h+='<td style="color:var(--t3)">'+(i+1)+'</td>';
    h+='<td style="font-weight:500;color:var(--t1)">'+x.sbu+'</td>';
    h+='<td style="color:var(--green);font-weight:600">'+x.receipts.toLocaleString()+'</td>';
    h+='<td style="color:var(--red);font-weight:600">'+x.issues.toLocaleString()+'</td>';
    h+='<td style="font-weight:600;color:'+(net>=0?'var(--green)':'var(--red)')+'">'+net.toLocaleString()+'</td>';
    h+='<td>'+x.rTx.toLocaleString()+'</td>';
    h+='<td>'+x.iTx.toLocaleString()+'</td>';
    h+='</tr>';
  });
  h+='<tr style="font-weight:700;background:rgba(14,165,164,0.06)"><td colspan="2" style="text-align:right;padding:10px">TOTAL</td><td style="color:var(--green)">'+tRec.toLocaleString()+'</td><td style="color:var(--red)">'+tIss.toLocaleString()+'</td><td style="color:'+((tRec-Math.abs(tIss))>=0?'var(--green)':'var(--red)')+'">'+(tRec-Math.abs(tIss)).toLocaleString()+'</td><td colspan="2"></td></tr>';
  h+='</tbody></table></div></div>';
  document.getElementById('content').innerHTML=h;
  setTimeout(function(){
    if(document.getElementById('c5')){
      var top5=RECEIPTS_ISSUES.slice().sort(function(a,b){return (b.receipts+Math.abs(b.issues))-(a.receipts+Math.abs(a.issues));}).slice(0,10);
      new Chart(document.getElementById('c5'),{type:'bar',data:{labels:top5.map(function(x){return x.sbu.substring(0,20);}),datasets:[{label:'Receipts',data:top5.map(function(x){return x.receipts/10000000;}),backgroundColor:'rgba(16,185,129,0.7)',borderColor:'#10B981',borderWidth:1},{label:'Issues',data:top5.map(function(x){return Math.abs(x.issues)/10000000;}),backgroundColor:'rgba(239,68,68,0.7)',borderColor:'#EF4444',borderWidth:1}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{color:'#898da5',font:{size:10}}}},scales:{x:{grid:{color:'rgba(52,59,79,0.3)'},ticks:{color:'#898da5',font:{size:7},maxRotation:45}},y:{grid:{color:'rgba(52,59,79,0.3)'},ticks:{color:'#898da5',font:{size:10},callback:function(v){return v+' Cr'}}}}}});
    }
    if(document.getElementById('c6')){
      var top6=RECEIPTS_ISSUES.slice().sort(function(a,b){return (b.rTx+b.iTx)-(a.rTx+a.iTx);}).slice(0,10);
      new Chart(document.getElementById('c6'),{type:'bar',data:{labels:top6.map(function(x){return x.sbu.substring(0,20);}),datasets:[{label:'Receipt Txns',data:top6.map(function(x){return x.rTx;}),backgroundColor:'rgba(16,185,129,0.7)',borderColor:'#10B981',borderWidth:1},{label:'Issue Txns',data:top6.map(function(x){return x.iTx;}),backgroundColor:'rgba(239,68,68,0.7)',borderColor:'#EF4444',borderWidth:1}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{color:'#898da5',font:{size:10}}}},scales:{x:{grid:{color:'rgba(52,59,79,0.3)'},ticks:{color:'#898da5',font:{size:7},maxRotation:45}},y:{grid:{color:'rgba(52,59,79,0.3)'},ticks:{color:'#898da5',font:{size:10}}}}}});
    }
  },100);
}

function showCurrentStock() {

  var h='';
  h+='<div class="kpi-row">';
  h+=kpi('#0EA5A4',TOP_ITEMS.length,'Top Items','Key inventory items');
  h+=kpi('#10B981',fmt(tVal),'Total Value','Top items combined');

  h+='</tbody></table></div></div>';
  document.getElementById('content').innerHTML=h;
  setTimeout(function(){
    if(document.getElementById('c7')){
      new Chart(document.getElementById('c7'),{type:'bar',indexAxis:'y',data:{labels:TOP_ITEMS.map(function(x){return x.item.substring(0,25);}),datasets:[{label:'Value (Cr)',data:TOP_ITEMS.map(function(x){return x.value/10000000;}),backgroundColor:['#0EA5A4','#FBBF24','#57C3FF','#9A91FB','#10B981','#EF4444','#FDB52A','#85DECB','#6C72FF','#003333','#007f7f','#126962','#0EA5A4','#FBBF24','#57C3FF','#9A91FB','#10B981','#EF4444','#FDB52A','#85DECB','#6C72FF','#003333','#007f7f','#126962'],borderColor:'#1d243c',borderWidth:1,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(52,59,79,0.3)'},ticks:{color:'#898da5',font:{size:10},callback:function(v){return v+' Cr'}}},y:{grid:{display:false},ticks:{color:'#898da5',font:{size:8}}}}}});
    }
    if(document.getElementById('c8')){
      new Chart(document.getElementById('c8'),{type:'bar',indexAxis:'y',data:{labels:TOP_ITEMS.map(function(x){return x.item.substring(0,25);}),datasets:[{label:'Quantity',data:TOP_ITEMS.map(function(x){return x.qty;}),backgroundColor:['rgba(16,185,129,0.7)','rgba(14,165,164,0.7)','rgba(87,195,255,0.7)','rgba(154,145,251,0.7)','rgba(251,191,36,0.7)','rgba(239,68,68,0.7)','rgba(253,181,42,0.7)','rgba(133,222,203,0.7)','rgba(108,114,255,0.7)','rgba(0,51,51,0.7)','rgba(0,127,127,0.7)','rgba(18,105,98,0.7)','rgba(16,185,129,0.7)','rgba(14,165,164,0.7)','rgba(87,195,255,0.7)','rgba(154,145,251,0.7)','rgba(251,191,36,0.7)','rgba(239,68,68,0.7)','rgba(253,181,42,0.7)','rgba(133,222,203,0.7)','rgba(108,114,255,0.7)','rgba(0,51,51,0.7)','rgba(0,127,127,0.7)','rgba(18,105,98,0.7)'],borderWidth:1,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(52,59,79,0.3)'},ticks:{color:'#898da5',font:{size:10}}},y:{grid:{display:false},ticks:{color:'#898da5',font:{size:8}}}}}});

function switchView(v){Object.keys(charts).forEach(function(k){if(charts[k])charts[k].destroy();});charts={};if(v==='overview')renderAll();else if(v==='negative')showNegativeStock();else if(v==='receipts')showReceiptsIssues();else if(v==='items')showCurrentStock();}


document.addEventListener('DOMContentLoaded',function(){
  var h='';
  h+='<div class="tabs" style="margin-bottom:16px">';
  h+='<span class="tab active" onclick="switchView('+"'overview'"+')">Overview</span>';
  h+='<span class="tab" onclick="switchView('+"'negative'"+')">Negative Stock Items</span>';
  h+='<span class="tab" onclick="switchView('+"'receipts'"+')">Receipts & Issues</span>';
  h+='<span class="tab" onclick="switchView('+"'items'"+')">Item-wise Stock</span>';
  h+='</div><div id="viewContent"></div>';
  document.getElementById('content').insertAdjacentHTML('beforeend',h);
  renderAll();
});
</script>
