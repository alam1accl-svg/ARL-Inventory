*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:16px 28px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.topbar h1{font-size:17px;color:var(--teal)}
.topbar .sub{font-size:11px;color:var(--t3)}
.main{padding:20px 28px;max-width:1800px;margin:0 auto}
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 18px}
.kpi .lbl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.kpi .val{font-size:22px;font-weight:700}
.kpi .sub{font-size:10px;color:var(--t3);margin-top:3px}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px 20px}
.chart-box h3{font-size:12px;color:var(--t2);margin-bottom:10px}
.chart-inner{height:280px;position:relative}
.tbl-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px 20px;margin-bottom:20px}
.tbl-box h3{font-size:12px;color:var(--t2);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.tbl-scroll{max-height:450px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;padding:7px 8px;color:var(--t3);font-size:9px;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:2}
td{padding:7px 8px;border-bottom:1px solid rgba(52,59,79,0.35);color:var(--t2)}
tr:hover td{background:rgba(14,165,164,0.04)}
.badge{padding:2px 7px;border-radius:3px;font-size:9px;font-weight:600;white-space:nowrap}
.bg-red{background:rgba(239,68,68,0.15);color:var(--red)}
.bg-green{background:rgba(16,185,129,0.15);color:var(--green)}
.bg-orange{background:rgba(253,181,42,0.15);color:var(--orange)}
.bg-teal{background:rgba(14,165,164,0.15);color:var(--teal)}
.bg-blue{background:rgba(87,195,255,0.15);color:var(--blue)}
.bg-purple{background:rgba(154,145,251,0.15);color:var(--purple)}
.neg{color:var(--red);font-weight:600}
.pos{color:var(--green);font-weight:600}
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:5px 12px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--t3);font-size:10px;cursor:pointer;transition:all 0.2s}
.tab:hover,.tab.active{background:rgba(14,165,164,0.15);border-color:var(--teal);color:var(--teal)}
.search{background:var(--card2);border:1px solid var(--border);border-radius:5px;padding:6px 10px;color:var(--t1);font-size:11px;width:240px}
.search:focus{outline:none;border-color:var(--teal)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@media(max-width:1200px){.kpi-row{grid-template-columns:repeat(3,1fr)}.chart-row{grid-template-columns:1fr}}
@media print{.topbar{position:static}body{background:#fff;color:#000}.kpi,.chart-box,.tbl-box{background:#fff;border:1px solid #ccc}}
</style>

    var C=['#0EA5A4','#FBBF24','#57C3FF','#9A91FB','#10B981','#EF4444','#FDB52A','#85DECB','#6C72FF','#003333','#007f7f','#126962'];
    if(document.getElementById('c1')){var top=CLOSE_STOCK.slice().sort(function(a,b){return Math.abs(b.net)-Math.abs(a.net);}).slice(0,12);charts.c1=new Chart(document.getElementById('c1'),{type:'bar',indexAxis:'y',data:{labels:top.map(function(x){return x.sbu.substring(0,22);}),datasets:[{data:top.map(function(x){return x.net/10000000;}),backgroundColor:top.map(function(x,i){return x.net>=0?C[i%12]+'99':'#EF444499';}),borderColor:top.map(function(x,i){return x.net>=0?C[i%12]:'#EF4444';}),borderWidth:1,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(52,59,79,0.3)'},ticks:{color:'#898da5',font:{size:9},callback:function(v){return v+' Cr'}}},y:{grid:{display:false},ticks:{color:'#898da5',font:{size:8}}}}}});}
    if(document.getElementById('c2')){var top2=PR_PENDING.slice().sort(function(a,b){return b.pendQty-a.pendQty;}).slice(0,10);charts.c2=new Chart(document.getElementById('c2'),{type:'bar',data:{labels:top2.map(function(x){return x.sbu.substring(0,20);}),datasets:[{data:top2.map(function(x){return x.pendQty/1000000;}),backgroundColor:C.slice(0,10).map(function(c){return c+'99'}),borderColor:C.slice(0,10),borderWidth:1,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(52,59,79,0.3)'},ticks:{color:'#898da5',font:{size:7},maxRotation:40}},y:{grid:{color:'rgba(52,59,79,0.3)'},ticks:{color:'#898da5',font:{size:9},callback:function(v){return v+'M'}}}}}});}
    if(document.getElementById('c3')){var top3=RCP_ISS.slice().sort(function(a,b){return(b.rec+Math.abs(b.iss))-(a.rec+Math.abs(a.iss));}).slice(0,10);charts.c3=new Chart(document.getElementById('c3'),{type:'bar',data:{labels:top3.map(function(x){return x.sbu.substring(0,18);}),datasets:[{label:'Receipts',data:top3.map(function(x){return x.rec/10000000;}),backgroundColor:'rgba(16,185,129,0.7)',borderColor:'#10B981',borderWidth:1},{label:'Issues',data:top3.map(function(x){return Math.abs(x.iss)/10000000;}),backgroundColor:'rgba(239,68,68,0.7)',borderColor:'#EF4444',borderWidth:1}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{color:'#898da5',font:{size:9}}}},scales:{x:{grid:{color:'rgba(52,59,79,0.3)'},ticks:{color:'#898da5',font:{size:7},maxRotation:45}},y:{grid:{color:'rgba(52,59,79,0.3)'},ticks:{color:'#898da5',font:{size:9},callback:function(v){return v+' Cr'}}}}}});}
    if(document.getElementById('c4')){charts.c4=new Chart(document.getElementById('c4'),{type:'bar',indexAxis:'y',data:{labels:GRN_ITEMS.map(function(x){return x.item.substring(0,22);}),datasets:[{data:GRN_ITEMS.map(function(x){return x.qty/1000;}),backgroundColor:C.slice(0,8).map(function(c){return c+'99'}),borderColor:C.slice(0,8),borderWidth:1,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(52,59,79,0.3)'},ticks:{color:'#898da5',font:{size:9},callback:function(v){return v+'K'}}},y:{grid:{display:false},ticks:{color:'#898da5',font:{size:9}}}}}});}
  },100);
}


function showPR() {
  var tPend=PR_PENDING.reduce(function(s,x){return s+x.pendQty;},0);
  var h='';
  h+='<div class="kpi-row">';
  h+=kpi('#FDB52A',PR_PENDING.length,'SBUs with Pending PR','Active purchase reqs');
  h+=kpi('#EF4444',tPend.toLocaleString(),'Total Pending Qty','All SBUs combined');
  h+=kpi('#57C3FF',PR_PENDING.reduce(function(s,x){return s+x.prCount;},0).toLocaleString(),'Total PRs','Purchase requisitions');
  h+=kpi('#9A91FB',TOP_PR_ITEMS.length,'Top PR Items','Highest pending');
  h+='</div>';
  h+='<div class="tbl-box"><h3>PR Pending - Item Wise Details</h3><div class="tbl-scroll"><table><thead><tr><th>#</th><th>SBU</th><th>Item</th><th>Requested Qty</th><th>Pending Qty</th><th>PO Qty</th><th>PR Count</th><th>Last PR</th></tr></thead><tbody>';
  TOP_PR_ITEMS.sort(function(a,b){return b.pend-a.pend;}).forEach(function(x,i){
    h+='<tr>';
    h+='<td style="color:var(--t3)">'+(i+1)+'</td>';
    h+='<td style="font-weight:500;color:var(--t1)">'+x.sbu+'</td>';
    h+='<td>'+x.item+'</td>';
    h+='<td>'+x.req.toLocaleString()+'</td>';
    h+='<td style="font-weight:600;color:var(--orange)">'+x.pend.toLocaleString()+'</td>';
    h+='<td style="color:var(--green)">'+x.po.toLocaleString()+'</td>';
    h+='<td>'+x.prs+'</td>';
    h+='<td style="color:var(--t3)">'+x.last+'</td>';
    h+='</tr>';
  });
  h+='</tbody></table></div></div>';
  document.getElementById('content').innerHTML=h;
}

function showGRN() {
  var h='';
  h+='<div class="kpi-row">';
  h+=kpi('#0EA5A4',GRN_ITEMS.length,'GRN Items','Gate entries received');
  h+=kpi('#10B981',GRN_ITEMS.reduce(function(s,x){return s+x.qty;},0).toLocaleString(),'Total GRN Qty','Magnum Steel');
  h+=kpi('#FBBF24',GRN_ITEMS.reduce(function(s,x){return s+x.grns;},0),'Total Gate Entries','Receipt transactions');
  h+=kpi('#57C3FF','Magnum Steel','Primary SBU','Only active GRN user');
  h+='</div>';
  h+='<div class="tbl-box"><h3>GRN - Goods Received (Gate Entry) Item Wise</h3><div class="tbl-scroll"><table><thead><tr><th>#</th><th>SBU</th><th>Item</th><th>Quantity Received</th><th>Gate Entries</th><th>Last GRN</th></tr></thead><tbody>';
  GRN_ITEMS.forEach(function(x,i){
    h+='<tr>';
    h+='<td style="color:var(--t3)">'+(i+1)+'</td>';
    h+='<td style="font-weight:500;color:var(--t1)">'+x.sbu+'</td>';
    h+='<td>'+x.item+'</td>';
    h+='<td style="font-weight:600;color:var(--teal)">'+x.qty.toLocaleString()+'</td>';
    h+='<td>'+x.grns+'</td>';
    h+='<td style="color:var(--t3)">'+x.last+'</td>';
    h+='</tr>';
  });
  h+='</tbody></table></div></div>';
  document.getElementById('content').innerHTML=h;
}

function showRcpIss() {
  var tRec=RCP_ISS.reduce(function(s,x){return s+x.rec;},0);
  var tIss=RCP_ISS.reduce(function(s,x){return s+Math.abs(x.iss);},0);
  var h='';
  h+='<div class="kpi-row">';
  h+=kpi('#10B981',fmt(tRec),'Total Receipts','All SBUs WMS');
  h+=kpi('#EF4444',fmt(tIss),'Total Issues','All SBUs WMS');
  h+=kpi('#57C3FF',RCP_ISS.reduce(function(s,x){return s+x.rTx+x.iTx;},0).toLocaleString(),'Total WMS Txns','Receipt + Issue');
  h+=kpi('#9A91FB',RCP_ISS.length,'Active SBUs','With WMS data');
  h+='</div>';
  h+='<div class="tbl-box"><h3>Receipts & Issues - SBU Wise</h3><div class="tbl-scroll"><table><thead><tr><th>#</th><th>SBU</th><th>Receipts (BDT)</th><th>Issues (BDT)</th><th>Net</th><th>Rcpt Txns</th><th>Issue Txns</th></tr></thead><tbody>';
  RCP_ISS.sort(function(a,b){return(b.rec+Math.abs(b.iss))-(a.rec+Math.abs(a.iss));}).forEach(function(x,i){
    var net=x.rec-Math.abs(x.iss);
    h+='<tr>';
    h+='<td style="color:var(--t3)">'+(i+1)+'</td>';
    h+='<td style="font-weight:500;color:var(--t1)">'+x.sbu+'</td>';
    h+='<td style="color:var(--green);font-weight:600">'+x.rec.toLocaleString()+'</td>';
    h+='<td style="color:var(--red);font-weight:600">'+x.iss.toLocaleString()+'</td>';
    h+='<td style="font-weight:600;color:'+(net>=0?'var(--green)':'var(--red)')+'">'+net.toLocaleString()+'</td>';
    h+='<td>'+x.rTx.toLocaleString()+'</td>';
    h+='<td>'+x.iTx.toLocaleString()+'</td>';
    h+='</tr>';
  });
  h+='</tbody></table></div></div>';
  document.getElementById('content').innerHTML=h;
}

function switchView(v){
  Object.keys(charts).forEach(function(k){if(charts[k])charts[k].destroy();});charts={};
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  if(v==='all')renderAll();else if(v==='pr')showPR();else if(v==='grn')showGRN();else if(v==='rec')showRcpIss();
  var tabs=document.querySelectorAll('.tab');for(var i=0;i<tabs.length;i++){if((v==='all'&&i===0)||(v==='pr'&&i===1)||(v==='grn'&&i===2)||(v==='rec'&&i===3))tabs[i].classList.add('active');}
}

function filterAll(){var q=(document.getElementById('gSearch')||{}).value||'';q=q.toLowerCase();var rows=document.querySelectorAll('tbody tr');rows.forEach(function(r){var d=r.getAttribute('data-search');r.style.display=(!q||(d&&d.indexOf(q)>=0))?'':'none';});}

renderAll();
</script>
</body>
</html>
