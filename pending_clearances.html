*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh}
.topbar{background:linear-gradient(180deg,#0d1525,#060b14);border-bottom:2px solid var(--red);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.topbar h1{font-size:20px;font-weight:900;background:linear-gradient(135deg,var(--red),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar .sub{font-size:10px;color:var(--t3)}
.topbar .count{font-size:28px;font-weight:900;color:var(--red)}
.topbar .count-label{font-size:10px;color:var(--t3);text-align:center}
.main{padding:16px 24px;max-width:1600px;margin:0 auto}
.chain{display:flex;flex-direction:column;gap:2px;margin-bottom:20px}
.level{display:flex;align-items:center;gap:0}
.level-connector{width:3px;height:30px;background:var(--border);margin:0 auto}
.level-badge{min-width:220px;padding:8px 14px;background:var(--card2);border:1px solid var(--border);border-radius:6px;font-size:11px;display:flex;align-items:center;justify-content:space-between}
.level-badge .name{font-weight:600;color:var(--t1)}
.level-badge .role{font-size:9px;color:var(--t3)}
.level-badge .count{font-weight:800;font-size:14px}
.level-arrow{margin:0 8px;color:var(--t3);font-size:16px}
.level-body{margin-left:223px;display:flex;flex-direction:column;gap:4px}
.section{background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:12px;overflow:hidden}
.section-header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--card2);border-bottom:1px solid var(--border);cursor:pointer}
.section-header:hover{background:rgba(239,68,68,0.05)}
.section-header h3{font-size:13px;font-weight:600}
.section-header .meta{font-size:10px;color:var(--t3)}
.section-body{max-height:0;overflow:hidden;transition:max-height 0.3s}
.section-body.open{max-height:2000px}
table{width:100%;border-collapse:collapse;font-size:10px}
th{text-align:left;padding:6px 10px;color:var(--t3);font-size:8px;text-transform:uppercase;border-bottom:1px solid var(--border);background:var(--card)}
td{padding:5px 10px;border-bottom:1px solid rgba(26,39,68,0.5);color:var(--t2)}
tr:hover td{background:rgba(239,68,68,0.03)}
.age-critical{color:var(--red);font-weight:700}
.age-warning{color:var(--orange);font-weight:600}
.age-normal{color:var(--green)}
.badge{padding:1px 6px;border-radius:3px;font-size:7px;font-weight:700;white-space:nowrap}
.b-r{background:rgba(239,68,68,0.15);color:var(--red)}
.b-o{background:rgba(253,181,42,0.15);color:var(--orange)}
.b-g{background:rgba(16,185,129,0.15);color:var(--green)}
.footer{text-align:center;padding:12px;font-size:9px;color:var(--t3);border-top:1px solid var(--border)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
@media print{body{background:#fff;color:#000}.section,.section-header{background:#fff;border:1px solid #ccc}}
</style>
</head>

  <div style="display:flex;gap:6px">

</div>

function build(){
  var totalP=SUMMARY.reduce(function(s,x){return s+x.c},0);
  var critical=SUMMARY.filter(function(x){return x.o>365}).reduce(function(s,x){return s+x.c},0);
  var sbus=SUMMARY.length;
  document.getElementById("totalCount").textContent=totalP;
  document.getElementById("oldestCount").textContent=critical;
  document.getElementById("sbuCount").textContent=sbus;

  var h="";

  // LEVEL 1: HOD
  h+='<div class="chain">';
  h+='<div class="level"><div class="level-badge" style="border-color:var(--red);background:rgba(239,68,68,0.08)"><div><div class="name" style="color:var(--red)">&#x1F451; BASHIR ALAM</div><div class="role">HOD - Inventory Material Department</div></div><div class="count" style="color:var(--red)">'+totalP+'</div></div>';

  h+='<div class="level"><div class="level-badge" style="border-color:var(--orange)"><div><div class="name" style="color:var(--orange)">&#x1F465; SBU LEADS</div><div class="role">Team Members</div></div><div class="count" style="color:var(--orange)">'+sbus+'</div></div>';

  h+='</div>';

  // SBU Sections
  h+='<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">';
  SUMMARY.sort(function(a,b){return b.c-a.c}).forEach(function(x){
    var bg=x.o>365?"var(--red)":x.o>180?"var(--orange)":"var(--teal)";
    var border=x.o>365?"var(--red)":x.o>180?"var(--orange)":"var(--teal)";
    h+='<div onclick="toggleSBU(\x60'+x.s.replace(/'/g,"\\'")+'\x60)" style="cursor:pointer;background:var(--card);border:1px solid '+border+';border-radius:6px;padding:8px 12px;min-width:180px;transition:all 0.2s" onmouseover="this.style.background='+"'var(--card2)'"+'" onmouseout="this.style.background='+"'var(--card)'"+'">';

    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">';
    h+='<span style="font-size:18px;font-weight:800;color:'+bg+'">'+x.c+'</span>';
    h+='<span style="font-size:9px;color:var(--t3)">Oldest: '+x.o+'d</span>';
    h+='</div></div>';
  });

  h+='<div class="section" style="border-color:var(--red)"><div class="section-header" onclick="this.nextElementSibling.classList.toggle(\x60open\x60)"><h3 style="color:var(--red)">&#x1F6A8; Critical Pending (>1 Year) - '+critical+' Items</h3><span class="meta">Click to expand</span></div><div class="section-body open"><table><thead><tr><th>#</th><th>SBU</th><th>PR Code</th><th>Request Date</th><th>Days Pending</th><th>Status</th></tr></thead><tbody>';
  REAL.filter(function(x){return x.a>365}).sort(function(a,b){return b.a-a.a}).forEach(function(x,i){
    h+='<tr><td style="color:var(--t3)">'+(i+1)+'</td><td style="font-weight:500;color:var(--t1)">'+x.s+'</td><td>'+x.p+'</td><td>'+x.d+'</td><td class="age-critical">'+x.a+' days</td><td><span class="badge b-r">CRITICAL</span></td></tr>';

  REAL.filter(function(x){return x.a>=180&&x.a<=365}).sort(function(a,b){return b.a-a.a}).forEach(function(x,i){

  });
  h+='</tbody></table></div></div>';

  document.getElementById("mainContent").innerHTML=h;

function collapseAll(){document.querySelectorAll(".section-body").forEach(function(x){x.classList.remove("open")})}

build();
</script>
